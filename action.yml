name: Setup hledger
description: Install hledger on the build agent
runs:
  using: composite
  steps:
    - name: Install hledger on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if command -v sudo >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y hledger
        else
          apt-get update
          apt-get install -y hledger
        fi
        command -v hledger >/dev/null 2>&1 || {
          echo "::error::Failed to install hledger on Linux."
          exit 1
        }

    - name: Install hledger on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install hledger
        command -v hledger >/dev/null 2>&1 || {
          echo "::error::Failed to install hledger on macOS."
          exit 1
        }

    - name: Install hledger on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
          Write-Host "::error::Chocolatey is required to install hledger on Windows runners. Use a runner image with Chocolatey pre-installed."
          exit 1
        }
        choco install hledger --yes
        if (-not (Get-Command hledger -ErrorAction SilentlyContinue)) {
          Write-Host "::error::Failed to install hledger on Windows."
          exit 1
        }
