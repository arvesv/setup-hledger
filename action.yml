name: setup-hledger
description: Install hledger on the build agent
runs:
  using: composite
  steps:
    - name: Install hledger on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if command -v sudo >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y hledger
        else
          apt-get update
          apt-get install -y hledger
        fi

    - name: Install hledger on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install hledger

    - name: Install hledger on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        choco install hledger --yes
