name: Test setup-hledger

on:
  workflow_dispatch:    

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup hledger
        uses: ./

      - name: Verify hledger is installed
        shell: bash
        run: hledger --version
