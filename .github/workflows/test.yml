name: Test setup-hledger

on:
  workflow_dispatch:    

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup hledger
        uses: ./

      - name: Verify hledger is installed
        shell: bash
        run: hledger --version
