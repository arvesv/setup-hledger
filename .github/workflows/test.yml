name: Test setup-hledger

on:
  workflow_dispatch:    

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup hledger
        uses: ./

      - name: Verify hledger is installed
        shell: bash
        run: hledger --version
