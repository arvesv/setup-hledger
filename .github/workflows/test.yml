name: Test setup-hledger

on:
  workflow_dispatch:    

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup hledger
        uses: ./

      - name: Verify hledger is installed
        shell: bash
        run: hledger --version
